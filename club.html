<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Club — GPBC Graveson</title>
<meta name="description" content="Le Graveson Provence Basket Club : club 100 % féminin en Provence, son histoire, ses valeurs et ses horaires d'entraînement.">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
<meta property="og:title" content="Le Club — GPBC Graveson">
<meta property="og:image" content="https://www.gpbc-graveson.fr/assets/og.jpg">
</head>
<body>

<section class="bandeau">
  <div class="sur">Graveson · Bouches-du-Rhône</div>
  <h1>Un club <span class="g">100 % féminin</span></h1>
  <p class="intro" id="presentation">Chargement…</p>
</section>

<main class="page">
  <div class="grille g3" id="valeurs"></div>

  <div class="sep">Planning des entraînements</div>
  <div class="carte" style="padding:12px;overflow-x:auto" id="planning">
    <p class="vide" style="border:none">Chargement…</p>
  </div>
  <p class="note">Les horaires sont gérés dans l'app Dimanche et toujours à jour ici.</p>
</main>

<script src="assets/supabase.js"></script>
<script src="assets/site.js"></script>
<script>
'use strict';
injecterEntete('club.html');

async function charger(){
  const contenus = await chargerContenus();
  document.getElementById('presentation').textContent =
    contenus.club_presentation || 'Présentation à venir.';
  const valeurs = (contenus.club_valeurs || 'Passion · Famille · Dépassement').split('·').map(v => v.trim()).filter(Boolean);
  document.getElementById('valeurs').innerHTML = valeurs.map((v, i) => `
    <div class="carte" style="text-align:center">
      <div style="font-size:26px;margin-bottom:6px">${['🏀', '❤️', '🔥', '⭐', '🤝'][i % 5]}</div>
      <h3>${v}</h3>
    </div>`).join('');

  // Planning en grille (comme la vue "impression" de l'app Dimanche) :
  // une ligne par catégorie, une colonne par jour, les séances dans les cases.
  const { data } = await bdd.from('site_entrainements').select('*');
  const seances = data || [];
  const zone = document.getElementById('planning');
  if(!seances.length){
    zone.innerHTML = '<p class="vide" style="border:none">Les horaires seront bientôt renseignés dans l\'app Dimanche.</p>';
    return;
  }

  // Jours ayant au moins une séance (1 = Lundi … 7 = Dimanche), dans l'ordre de la semaine
  const jours = [...new Set(seances.map(s => s.jour))].sort((a, b) => a - b);
  // Catégories triées par âge : U7 avant U9 avant U11… puis les Seniors à la fin
  const poidsCategorie = c => { const m = /^u\s*(\d+)/i.exec(c || ''); return m ? +m[1] : 999; };
  const categories = [...new Set(seances.map(s => s.categorie || ''))]
    .sort((a, b) => (poidsCategorie(a) - poidsCategorie(b)) || a.localeCompare(b, 'fr'));

  const caseSeances = (cat, jour) => {
    const liste = seances
      .filter(s => (s.categorie || '') === cat && s.jour === jour)
      .sort((a, b) => String(a.heure_debut).localeCompare(String(b.heure_debut)));
    if(!liste.length) return '<td class="off"></td>';
    return '<td>' + liste.map(s => `
      <div class="seance">
        <b>${fmtHeure(s.heure_debut)} – ${fmtHeure(s.heure_fin)}</b>
        ${s.lieu ? `<span>📍 ${s.lieu}</span>` : ''}
        ${s.entraineur ? `<span>👤 ${s.entraineur}</span>` : ''}
      </div>`).join('') + '</td>';
  };

  zone.innerHTML = `<table class="planning">
    <thead><tr><th></th>${jours.map(j => `<th>${JOURS[j] || ''}</th>`).join('')}</tr></thead>
    <tbody>${categories.map(cat => `
      <tr>
        <th class="pcat"><span>${cat}</span></th>
        ${jours.map(j => caseSeances(cat, j)).join('')}
      </tr>`).join('')}
    </tbody>
  </table>`;
}
charger();
</script>
</body>
</html>
